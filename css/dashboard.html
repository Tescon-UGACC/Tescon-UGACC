
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard | TESCON UGACC</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div>
      <h1>TESCON UGACC</h1>
      <p>Commitment Without Inducement</p>
    </div>
  </header>

  <main class="welcome">
    <h2>Student Dashboard</h2>
    <p id="studentWelcome">Welcome to your membership portal.</p>

    <section aria-labelledby="applicationHeading">
      <h3 id="applicationHeading">My Application</h3>
      <p>Application status:
        <strong id="applicationStatus">Loading...</strong>
      </p>
      <p id="applicationMessage" role="status" aria-live="polite">
        Your application details will appear here after sign-in.
      </p>
    </section>

    <button class="button button-secondary" id="logoutButton" type="button">
      Sign Out
    </button>

    <p><a href="index.html">Back to home</a></p>
  </main>
</body>
</html>
