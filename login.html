<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | TESCON UGACC</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header"><div><h1>TESCON UGACC</h1><p>Commitment Without Inducement</p></div></header>
<main class="welcome">
  <h2>Sign In</h2><p>Sign in to access your membership portal.</p>
  <form id="loginForm">
    <label for="email">Email address</label><input id="email" type="email" required autocomplete="email">
    <label for="password">Password</label><input id="password" type="password" required autocomplete="current-password">
    <button class="button button-primary" type="submit">Sign In</button>
    <p id="loginMessage" role="status" aria-live="polite"></p>
  </form>
  <p>New student? <a href="register.html">Register here</a>.</p><p><a href="index.html">Back to Home</a></p>
</main>
<script type="module">
import { signIn, signOut } from "./js/auth.js";
import { supabase } from "./js/supabaseClient.js";
const form = document.getElementById("loginForm");
const message = document.getElementById("loginMessage");
form.addEventListener("submit", async (event) => {
  event.preventDefault(); message.textContent = "Signing in...";
  const button = form.querySelector("button"); button.disabled = true;
  try {
    const user = await signIn(document.getElementById("email").value.trim(), document.getElementById("password").value);
    const { data: profile, error } = await supabase.from("profiles").select("role").eq("id", user.id).maybeSingle();
    if (error) throw error;
    if (profile?.role === "admin") location.href = "admin.html";
    else location.href = "dashboard.html";
  } catch (error) { message.textContent = error.message || "Sign-in failed. Check your details."; }
  finally { button.disabled = false; }
});
</script>
</body></html>
